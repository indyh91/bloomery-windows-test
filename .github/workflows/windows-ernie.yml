name: Windows ERNIE SM86
on:
  push:
    branches: [main, native-windows-ernie, windows-ernie-mxfp4-perf]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Win32 services and the ERNIE protocol with the vendor tokenizer
        shell: powershell
        run: |
          $env:RUSTUP_TOOLCHAIN = (Select-String -Path rust-toolchain.toml -Pattern 'channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:BLOOMERY_REF_MODEL = Join-Path $env:RUNNER_TEMP 'ernie-tokenizer'
          New-Item -ItemType Directory -Force $env:BLOOMERY_REF_MODEL | Out-Null
          $vocab = Join-Path $env:BLOOMERY_REF_MODEL 'tokenizer.json'
          curl.exe --retry 3 -fsSL 'https://huggingface.co/baidu/ERNIE-5.5-Flash-Preview/resolve/ace1100dcde7bf4eb06add6ae11ce4f43a11ddfe/tokenizer.json' -o $vocab
          if ($LASTEXITCODE -or (Get-FileHash $vocab).Hash -ne '20e7c81f36fdfb90db664583fc6426d5c2ac6d6bcaf631c910941a8d8f30f2d9') { throw 'Tokenizer download or hash failed' }
          cargo test --locked -p bloomery-os --target x86_64-pc-windows-msvc --lib --test windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p bloomery-serve --test ernie55 --target x86_64-pc-windows-msvc -- --include-ignored
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($arm in @('0','1')) {
            $env:BLOOMERY_QDOT_AVX512 = $arm
            cargo test --locked --release -p bloomery-qdot --test qdot --target x86_64-pc-windows-msvc mxfp4_dispatch_bit_parity -- --nocapture
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Remove-Item Env:BLOOMERY_QDOT_AVX512
          cargo test --locked -p bloomery-model-hf --test ernie55_quantize --target x86_64-pc-windows-msvc native_ernie_cache_round_trip
          exit $LASTEXITCODE
  build:
    needs: windows-tests
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned CUDA and LLVM build inputs
        shell: pwsh
        run: python tools/windows/ci_toolchain.py "$env:RUNNER_TEMP\ernie-sdk"
      - name: Build native server and exercise the Windows loader
        shell: powershell
        run: |
          .\tools\windows\Build-ERNIE.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = '.\target\x86_64-pc-windows-msvc\release\bloomery-serve.exe'
          & $exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/windows/verify_kernels.py $exe "$env:CUDA_PATH\bin\ptxas.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $exe,Start-ERNIE.ps1,docs/windows-ernie.md,LICENSE -Destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: Bloomery-ERNIE-Windows-x64-SM86
          path: dist/*
          if-no-files-found: error
